<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SXX-2 会员店代购小程序 — Mockup v0.2</title>
<style>
  :root{
    --brand:#07C160;          /* 微信绿，占位品牌色【待确认 Q-32】 */
    --brand-dark:#06AD56;
    --text:#1A1A1A;
    --text-2:#5C5C5C;
    --text-3:#8C8C8C;
    --bg:#F5F6F7;
    --surface:#FFFFFF;
    --border:#E5E6E8;
    --ok:#07C160;
    --warn:#FF8F1F;
    --err:#FA5151;
    --focus:#0052D9;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
       color:var(--text);background:#fff;-webkit-font-smoothing:antialiased}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ---------- 外壳 ---------- */
  .shell{display:flex;min-height:100vh}
  .side{width:230px;flex:0 0 230px;background:#Fafbfc;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .side h1{font-size:15px;margin:0 0 4px}
  .side .meta{font-size:12px;color:var(--text-3);margin-bottom:14px;line-height:1.6}
  .side .grp{font-size:11px;color:var(--text-3);letter-spacing:.5px;margin:14px 0 6px;text-transform:uppercase}
  .navbtn{display:block;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--text);
          background:transparent;border:0;border-radius:8px;padding:9px 10px;margin:2px 0;cursor:pointer;min-height:44px}
  .navbtn:hover{background:#EFF1F3}
  .navbtn[aria-selected="true"]{background:var(--brand);color:#fff;font-weight:600}
  .navbtn:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
  .main{flex:1;padding:20px 24px 60px;min-width:0}
  .main h2{font-size:18px;margin:0 0 2px}
  .main .desc{font-size:13px;color:var(--text-2);margin:0 0 4px}
  .states{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:16px}

  /* ---------- 手机框 ---------- */
  .frame-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 12px 14px}
  .frame-wrap .cap{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .tag{font-size:11px;font-weight:500;color:var(--text-2);background:#F0F1F3;border-radius:4px;padding:1px 6px}
  .note{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.5}
  .phone{width:300px;height:600px;border:1px solid #D8DADD;border-radius:22px;overflow:hidden;background:var(--bg);
         display:flex;flex-direction:column;margin:0 auto;position:relative}
  .statusbar{height:26px;flex:0 0 26px;background:#fff;display:flex;align-items:center;justify-content:space-between;
             padding:0 12px;font-size:10px;color:var(--text);font-weight:600}
  .navbar{height:44px;flex:0 0 44px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
          justify-content:center;font-size:14px;font-weight:600;position:relative}
  .navbar .back{position:absolute;left:10px;font-size:16px;color:var(--text-2)}
  .body{flex:1;overflow:auto;padding:10px}
  .tabbar{height:52px;flex:0 0 52px;background:#fff;border-top:1px solid var(--border);display:flex}
  .tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--text-3);gap:2px}
  .tabbar div.on{color:var(--brand);font-weight:600}

  /* ---------- 通用组件 ---------- */
  .card{background:var(--surface);border-radius:var(--radius);padding:12px;margin-bottom:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .h3{font-size:14px;font-weight:600;margin:0 0 6px}
  .p{font-size:12px;color:var(--text-2);margin:2px 0;line-height:1.6}
  .small{font-size:11px;color:var(--text-3)}
  .price{color:var(--err);font-weight:700;font-size:16px}
  .price-s{color:var(--err);font-weight:700;font-size:13px}
  .strike{text-decoration:line-through;color:var(--text-3);font-size:11px;margin-left:4px}
  .btn{display:block;width:100%;min-height:44px;border:0;border-radius:8px;background:var(--brand);color:#fff;
       font:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn:disabled{background:#C8CDD2;color:#fff;cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .btn-row{display:flex;gap:8px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--border);border-radius:8px;
       padding:10px;font:inherit;font-size:13px;background:#fff;color:var(--text)}
  .field input:focus-visible,.field select:focus-visible{outline:3px solid var(--focus);outline-offset:0;border-color:var(--focus)}
  .field .err{color:var(--err);font-size:11px;margin-top:4px;display:flex;gap:4px;align-items:flex-start}
  .field.bad input{border-color:var(--err)}
  .badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;display:inline-block}
  .b-ok{background:#E6F7EE;color:#06AD56}
  .b-warn{background:#FFF3E6;color:#C96A00}
  .b-err{background:#FDECEC;color:#C43C3C}
  .b-gray{background:#F0F1F3;color:#5C5C5C}
  .bar{height:6px;background:#EDEFF0;border-radius:3px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--brand)}
  .list-item{background:#fff;border-radius:var(--radius);padding:10px;margin-bottom:8px;display:flex;gap:10px}
  .thumb{width:64px;height:64px;flex:0 0 64px;border-radius:8px;background:#EDEFF0;display:flex;
         align-items:center;justify-content:center;font-size:10px;color:var(--text-3)}
  .empty{text-align:center;padding:56px 20px;color:var(--text-3)}
  .empty .ico{font-size:34px;margin-bottom:8px}
  .skel{background:linear-gradient(90deg,#EDEFF0 25%,#F6F7F8 37%,#EDEFF0 63%);background-size:400% 100%;
        animation:sh 1.2s ease infinite;border-radius:6px}
  @keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .center{text-align:center}
  .mt12{margin-top:12px}.mt16{margin-top:16px}
  .divider{height:1px;background:var(--border);margin:10px 0}
  .alert{background:#FDECEC;border:1px solid #F7C9C9;color:#C43C3C;border-radius:8px;padding:10px;font-size:12px;
         display:flex;gap:6px;align-items:flex-start}
  .alert.ok{background:#E6F7EE;border-color:#B7E6CB;color:#0A6B3C}
  .toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;
         padding:10px 14px;border-radius:8px;font-size:12px;z-index:5}
  .spinner{width:26px;height:26px;border:3px solid #E3E5E7;border-top-color:var(--brand);border-radius:50%;
           animation:sp .8s linear infinite;margin:14px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .check{width:42px;height:42px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;
         justify-content:center;font-size:22px;margin:12px auto}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--text-2)}
  .kv b{color:var(--text);font-weight:600}
  .search{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;
          padding:6px 10px;min-height:40px;margin-bottom:8px}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:13px;min-height:28px;background:transparent}
  .search .ico{color:var(--text-3);font-size:14px}
  .search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px rgba(0,82,217,.18)}
  .search .clear{font-size:14px;color:var(--text-3);border:0;background:transparent;min-width:28px;min-height:28px;cursor:pointer}
  .hit{background:#FFF6DA;border-radius:2px;padding:0 1px;font-weight:600}
  .step{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--text-3);margin-bottom:8px}
  .step .dot{width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:10px;display:flex;
             align-items:center;justify-content:center;flex:0 0 18px}
  .step.off .dot{background:#C8CDD2}
  table.mini{width:100%;border-collapse:collapse;font-size:11px}
  table.mini th,table.mini td{border-bottom:1px solid var(--border);padding:6px 4px;text-align:left}
  table.mini th{color:var(--text-3);font-weight:600}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" role="tablist" aria-label="页面导航" aria-orientation="vertical">
    <h1>SXX-2 Mockup v0.2</h1>
    <div class="meta">会员店代购小程序<br>移动端 375px 基准 · 全状态<br>PRD: docs/PRD.md</div>
    <div class="grp">用户端</div>
    <div id="nav-user"></div>
    <div class="grp">团长端</div>
    <div id="nav-leader"></div>
  </aside>
  <main class="main">
    <h2 id="pg-title"></h2>
    <p class="desc" id="pg-desc"></p>
    <p class="small" id="pg-fr"></p>
    <div class="states" id="states"></div>
  </main>
</div>

<script>
/* ============ 页面定义 ============ */
const TABBAR = u => `<div class="tabbar">
  <div class="${u===0?'on':''}">团购</div><div class="${u===1?'on':''}">订单</div><div class="${u===2?'on':''}">我的</div></div>`;
const SB = `<div class="statusbar"><span>9:41</span><span>信号 100%</span></div>`;

const PAGES = [
/* ---------- P-1 ---------- */
{id:'P-1',side:'user',title:'P-1 登录 / 角色入口',fr:'FR-1',
 desc:'微信进入小程序后的身份建立与角色分流。角色是否需审核见【Q-06】。',
 states:[
  {n:'默认（未登录）',t:'首屏：展示价值主张与两个入口。',b:`
    <div class="center" style="padding:40px 18px">
      <div style="font-size:44px">🛒</div>
      <div class="h3 mt12" style="font-size:17px">会员店代购</div>
      <p class="p">山姆 / 盒马 · 社区团购</p>
      <div class="mt16"><button class="btn">微信一键登录</button></div>
      <p class="small mt12">登录即同意《用户协议》《隐私政策》</p>
      <div class="divider"></div>
      <p class="small">我是团长？ <a href="#" style="color:var(--focus)">申请成为团长</a></p>
    </div>`},
  {n:'加载中',t:'登录请求进行中，按钮禁用防重复点击。',b:`
    <div class="center" style="padding:40px 18px">
      <div style="font-size:44px">🛒</div>
      <div class="h3 mt12" style="font-size:17px">会员店代购</div>
      <div class="mt16"><button class="btn" disabled>登录中…</button></div>
      <div class="spinner"></div>
    </div>`},
  {n:'授权拒绝',t:'用户拒绝授权：给出明确原因与再次授权入口，不静默失败（AC-1.3）。',b:`
    <div class="center" style="padding:40px 18px">
      <div style="font-size:44px">🛒</div>
      <div class="h3 mt12" style="font-size:17px">会员店代购</div>
      <div class="alert mt16"><span>⚠</span><span>你拒绝了微信授权，无法为你建立账号。浏览团购需要授权身份。</span></div>
      <div class="mt12"><button class="btn">重新授权</button></div>
      <div class="mt12"><button class="btn ghost">仅浏览（部分功能不可用）</button></div>
    </div>`},
  {n:'网络异常',t:'弱网/超时：可重试，不白屏。',b:`
    <div class="center" style="padding:40px 18px">
      <div style="font-size:44px">📶</div>
      <div class="h3 mt12">网络似乎不太稳定</div>
      <p class="p">登录超时，请检查网络后重试。</p>
      <div class="mt16"><button class="btn">重试</button></div>
    </div>`}
 ]},

/* ---------- P-2 ---------- */
{id:'P-2',side:'user',title:'P-2 团购列表（用户）',fr:'FR-6.1 / FR-13',
 desc:'进行中的团购列表，含搜索框、起团量进度与截团倒计时。进度与剩余时间须与服务端一致（AC-6.1）；搜索态见 FR-13。',
 states:[
  {n:'默认（含搜索框）',t:'顶部常驻搜索框 + 列表卡片。搜索与状态筛选为「与」关系（FR-13.4）。',b:`
   ${SB}<div class="navbar">今日团购</div><div class="body">
    <div class="search"><span class="ico">🔍</span><input placeholder="搜索商品 / 团长 / 店铺" aria-label="搜索团购">
      <button class="clear" aria-label="清空搜索">✕</button></div>
    <div class="row" style="gap:6px;margin-bottom:8px"><span class="badge b-ok">全部</span><span class="badge b-gray">进行中</span><span class="badge b-gray">即将截团</span></div>
    <div class="list-item">
      <div class="thumb">图</div>
      <div style="flex:1;min-width:0">
        <div class="h3">Member's Mark 冷冻蓝莓 1.36kg</div>
        <div class="p">山姆 · 1.36kg/袋</div>
        <div class="row" style="margin-top:4px">
          <div><span class="price-s">¥89.9</span><span class="strike">¥109</span></div>
          <span class="small">剩 12:34:05</span>
        </div>
        <div class="bar"><i style="width:60%"></i></div>
        <div class="small">已团 30 / 50 份起团</div>
      </div>
    </div>
    <div class="list-item">
      <div class="thumb">图</div>
      <div style="flex:1;min-width:0">
        <div class="h3">盒马 帝皇鲜 三文鱼刺身 300g</div>
        <div class="p">盒马 · 300g/盒</div>
        <div class="row" style="margin-top:4px">
          <div><span class="price-s">¥68.0</span></div><span class="small">剩 2 天 03:11</span>
        </div>
        <div class="bar"><i style="width:100%;background:var(--ok)"></i></div>
        <div class="small">已达成团量 · 截团后即成团</div>
      </div>
    </div>
    <div class="list-item" style="opacity:.62">
      <div class="thumb">图</div>
      <div style="flex:1;min-width:0">
        <div class="h3">MM 瑞士卷 16 枚 <span class="badge b-gray">已截团</span></div>
        <div class="p">山姆 · 16 枚/盒</div>
        <div class="row" style="margin-top:4px"><div><span class="price-s">¥45.0</span></div>
        <span class="small">已结束</span></div>
      </div>
    </div></div>${TABBAR(0)}`},
  {n:'加载中',t:'骨架屏，避免布局跳动。',b:`
   ${SB}<div class="navbar">今日团购</div><div class="body">
    ${[1,2,3].map(()=>`<div class="list-item"><div class="skel thumb"></div><div style="flex:1">
      <div class="skel" style="height:14px;width:80%"></div>
      <div class="skel" style="height:10px;width:50%;margin-top:8px"></div>
      <div class="skel" style="height:6px;margin-top:10px"></div></div></div>`).join('')}
   </div>${TABBAR(0)}`},
  {n:'空态',t:'无进行中团购：说明原因 + 引导。',b:`
   ${SB}<div class="navbar">今日团购</div><div class="body">
    <div class="empty"><div class="ico">🛍️</div><div class="h3">暂无进行中的团购</div>
      <p class="p">你附近的团长还没有开团，晚点再来看看。</p>
      <div class="mt12"><button class="btn ghost" style="width:auto;padding:0 18px">刷新</button></div></div>
   </div>${TABBAR(0)}`},
  {n:'错误',t:'拉取失败：可重试，不白屏。',b:`
   ${SB}<div class="navbar">今日团购</div><div class="body">
    <div class="alert"><span>⚠</span><span>加载失败（网络异常）。请下拉重试。</span></div>
    <div class="center mt16"><button class="btn ghost" style="width:auto;padding:0 18px">重新加载</button></div>
   </div>${TABBAR(0)}`},
  {n:'输入中（防抖）',t:'已输入「蓝」但未达最小触发长度：不发请求、列表不闪空，仅顶部给出轻量提示（AC-13.5）。',b:`
   ${SB}<div class="navbar">今日团购</div><div class="body">
    <div class="search"><span class="ico">🔍</span><input value="蓝" aria-label="搜索团购" style="font-weight:600">
      <button class="clear" aria-label="清空搜索">✕</button></div>
    <p class="small" style="margin:0 0 8px">再输入 1 个字开始搜索（最小触发长度待确认 Q-38）</p>
    <div class="list-item"><div class="thumb">图</div><div style="flex:1;min-width:0">
      <div class="h3">Member's Mark 冷冻蓝莓 1.36kg</div>
      <p class="p">山姆 · 1.36kg/袋</p>
      <div class="row" style="margin-top:4px"><div><span class="price-s">¥89.9</span></div><span class="small">剩 12:34:05</span></div></div></div>
    <div class="list-item"><div class="thumb">图</div><div style="flex:1;min-width:0">
      <div class="h3">盒马 帝皇鲜 三文鱼刺身 300g</div>
      <p class="p">盒马 · 300g/盒</p>
      <div class="row" style="margin-top:4px"><div><span class="price-s">¥68.0</span></div><span class="small">剩 2 天 03:11</span></div></div></div>
   </div>${TABBAR(0)}`},
  {n:'搜索中（已触发）',t:'关键词「蓝莓」已达触发长度：防抖 300ms 后发起请求，搜索框内显示载入指示，列表保持上一次结果避免跳动。',b:`
   ${SB}<div class="navbar">今日团购</div><div class="body">
    <div class="search"><span class="ico">🔍</span><input value="蓝莓" aria-label="搜索团购" style="font-weight:600">
      <span style="width:16px;height:16px;border:2px solid #D8DADD;border-top-color:var(--brand);border-radius:50%;
            display:inline-block;animation:sp .8s linear infinite"></span>
      <button class="clear" aria-label="清空搜索">✕</button></div>
    <p class="small" style="margin:0 0 8px">搜索中…（连续输入只发一次请求，防抖待确认 Q-37）</p>
    <div class="list-item" style="opacity:.55"><div class="thumb">图</div><div style="flex:1;min-width:0">
      <div class="h3">Member's Mark 冷冻蓝莓 1.36kg</div><p class="p">上一次结果保留中</p></div></div>
   </div>${TABBAR(0)}`},
  {n:'搜索有结果',t:'命中项高亮关键词；顶部回显「找到 N 个结果」；筛选与关键词并存（AC-13.8）。',b:`
   ${SB}<div class="navbar">今日团购</div><div class="body">
    <div class="search"><span class="ico">🔍</span><input value="蓝莓" aria-label="搜索团购" style="font-weight:600">
      <button class="clear" aria-label="清空搜索">✕</button></div>
    <div class="row" style="margin-bottom:8px"><span class="small">找到 3 个结果 · 关键词「蓝莓」</span>
      <span class="badge b-gray">筛选：进行中</span></div>
    <div class="list-item"><div class="thumb">图</div><div style="flex:1;min-width:0">
      <div class="h3">Member's Mark 冷冻<span class="hit">蓝莓</span> 1.36kg</div>
      <p class="p">山姆 · 1.36kg/袋</p>
      <div class="row" style="margin-top:4px"><div><span class="price-s">¥89.9</span></div><span class="small">剩 12:34:05</span></div></div></div>
    <div class="list-item"><div class="thumb">图</div><div style="flex:1;min-width:0">
      <div class="h3">MM <span class="hit">蓝莓</span>干 200g</div>
      <p class="p">山姆 · 200g/袋</p>
      <div class="row" style="margin-top:4px"><div><span class="price-s">¥42.0</span></div><span class="small">剩 1 天 08:20</span></div></div></div>
    <div class="list-item"><div class="thumb">图</div><div style="flex:1;min-width:0">
      <div class="h3">盒马 有机<span class="hit">蓝莓</span> 125g×4</div>
      <p class="p">盒马 · 500g</p>

 ]}
];

/* ============ 渲染 ============ */
const navU=document.getElementById('nav-user'), navL=document.getElementById('nav-leader');
PAGES.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='navbtn'; b.type='button'; b.role='tab'; b.textContent=`${p.id} ${p.title.replace(/^P-\d+\s/,'')}`;
  b.setAttribute('aria-selected', i===0?'true':'false');
  b.onclick=()=>select(i);
  (p.side==='user'?navU:navL).appendChild(b);
});
function select(i){
  const p=PAGES[i];
  [...document.querySelectorAll('.navbtn')].forEach((b,j)=>b.setAttribute('aria-selected', j===i?'true':'false'));
  document.getElementById('pg-title').textContent=p.title;
  document.getElementById('pg-desc').textContent=p.desc;
  document.getElementById('pg-fr').textContent='对应 '+p.fr+' · 共 '+p.states.length+' 个状态';
  document.getElementById('states').innerHTML=p.states.map(s=>`
    <section class="frame-wrap">
      <div class="cap">${s.n} <span class="tag">${p.id}</span></div>
      <div class="phone" role="img" aria-label="${p.id} ${s.n}">${s.b}</div>
      <div class="note">${s.t}</div>
    </section>`).join('');
  window.scrollTo({top:0,behavior:'auto'});
}
select(0);
</script>
</body>
</html>
